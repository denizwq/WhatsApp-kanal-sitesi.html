<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Kanalım</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:#fff;
  background:radial-gradient(circle at top,#123d2b 0,#07130f 38%,#030806 100%);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.bg{position:fixed;inset:0;pointer-events:none}
.circle{position:absolute;border-radius:50%;filter:blur(2px);opacity:.18;animation:float 7s ease-in-out infinite}
.c1{width:180px;height:180px;background:#25D366;top:8%;left:8%}
.c2{width:260px;height:260px;background:#128C7E;bottom:-80px;right:4%;animation-delay:1.5s}
@keyframes float{50%{transform:translateY(-22px) scale(1.05)}}
.card{
  position:relative;width:min(92%,470px);padding:38px 25px;
  text-align:center;border:1px solid rgba(255,255,255,.12);
  border-radius:30px;background:rgba(8,18,14,.78);
  backdrop-filter:blur(16px);box-shadow:0 25px 80px rgba(0,0,0,.5);
  animation:up .7s ease;
}
@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
.logo{
  width:86px;height:86px;margin:0 auto 18px;border-radius:25px;
  display:grid;place-items:center;background:#25D366;
  font-size:45px;box-shadow:0 0 35px rgba(37,211,102,.35);
}
h1{font-size:32px;margin-bottom:10px}
p{color:#b8c7c0;line-height:1.5;margin-bottom:25px}
.btn{
  display:block;text-decoration:none;color:#06100b;background:#25D366;
  padding:16px;border-radius:16px;font-weight:800;font-size:17px;
  transition:.2s;box-shadow:0 10px 30px rgba(37,211,102,.18);
}
.btn:hover{transform:translateY(-3px);background:#32e875}
.info{display:flex;gap:10px;margin-top:18px}
.box{flex:1;padding:13px 8px;border-radius:15px;background:rgba(255,255,255,.06)}
.box b{display:block;font-size:18px}.box span{font-size:12px;color:#8fa39a}
footer{margin-top:25px;font-size:12px;color:#687a71}
</style>
</head>
<body>
<div class="bg"><div class="circle c1"></div><div class="circle c2"></div></div>

<main class="card">
  <div class="logo">💬</div>
  <h1>WhatsApp Kanalım</h1>
  <p>Yeni paylaşımlar, eğlenceli içerikler ve daha fazlası için kanala katıl! 🔥</p>

  <!-- KANAL LİNKİNİ AŞAĞIDAKİ href KISMINA YAZ -->
  <a class="btn" href="https://whatsapp.com/channel/DEĞİŞTİR" target="_blank">
    💚 WhatsApp Kanalına Katıl
  </a>

  <div class="info">
    <div class="box"><b>🔥</b><span>Yeni içerikler</span></div>
    <div class="box"><b>⚡</b><span>Aktif kanal</span></div>
    <div class="box"><b>💚</b><span>WhatsApp</span></div>
  </div>

  <footer>© 2026 • WhatsApp Kanalım</footer>
</main>
</body>
</html>
